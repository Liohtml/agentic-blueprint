<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 640px;
    background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 40%, #2d1b4e 70%, #1a1a3e 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Grid pattern overlay */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Glow orbs */
  .orb1 {
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%);
    top: -50px; right: 100px;
    border-radius: 50%;
  }
  .orb2 {
    position: absolute;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(168,85,247,0.25) 0%, transparent 70%);
    bottom: -30px; left: 80px;
    border-radius: 50%;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 80px;
  }

  .icon-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .icon-box {
    width: 48px; height: 48px;
    border: 1px solid rgba(99,102,241,0.5);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(99,102,241,0.1);
  }

  h1 {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.1;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 50%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 24px;
    color: rgba(255,255,255,0.6);
    font-weight: 400;
    margin-bottom: 40px;
    line-height: 1.4;
  }

  .pills {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .pill {
    padding: 8px 20px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(4px);
  }

  .pill.highlight {
    border-color: rgba(99,102,241,0.5);
    color: #c7d2fe;
    background: rgba(99,102,241,0.15);
  }

  .version {
    position: absolute;
    bottom: 24px;
    right: 40px;
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    z-index: 1;
  }

  .gh {
    position: absolute;
    bottom: 24px;
    left: 40px;
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>

  <div class="content">
    <div class="icon-row">
      <div class="icon-box">&#x1F916;</div>
      <div class="icon-box">&#x2699;</div>
      <div class="icon-box">&#x1F504;</div>
      <div class="icon-box">&#x2705;</div>
      <div class="icon-box">&#x1F680;</div>
    </div>
    <h1>Agentic Blueprint</h1>
    <p class="subtitle">A framework for autonomous AI-driven engineering workflows.<br>Ship faster with structured agent collaboration.</p>
    <div class="pills">
      <span class="pill highlight">6 Phases</span>
      <span class="pill highlight">Multi-Agent</span>
      <span class="pill highlight">Feedback Loops</span>
      <span class="pill">Claude Code</span>
      <span class="pill">Context Engineering</span>
      <span class="pill">Quality Gates</span>
    </div>
  </div>

  <div class="gh">github.com/Liohtml/agentic-blueprint</div>
  <div class="version">v1.0</div>
</body>
</html>
